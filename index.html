
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Mi Biblioteca</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Mi Biblioteca</h1>

  <div class="counters">
    <div class="counter">
      <strong id="totalBooks">0</strong>
      <span>Libros registrados</span>
    </div>

    <div class="counter">
      <strong id="totalReadings">0</strong>
      <span>Lecturas del año</span>
    </div>
  </div>
</header>

<nav class="navigation">
  <button type="button" data-section="nuevoLibro">
    Nuevo libro
  </button>

  <button type="button" data-section="biblioteca">
    Biblioteca
  </button>

  <button type="button" data-section="nuevaLectura">
    Nueva lectura
  </button>

  <button type="button" data-section="lecturas">
    Lecturas por año
  </button>

  <button type="button" data-section="copias">
    Copias
  </button>
</nav>

<main>

  <!-- NUEVO LIBRO -->

  <section id="nuevoLibro" class="section">

    <h2 id="formTitle">Nuevo libro</h2>

    <form id="bookForm">

      <input type="hidden" id="bookId">

      <label for="title">Título</label>
      <input id="title" type="text" maxlength="200" required>

      <label for="author">Autor</label>
      <input id="author" type="text" maxlength="150" required>

      <label for="status">Estado</label>
      <select id="status">
        <option value="pendiente">Pendiente</option>
        <option value="leyendo">Leyendo</option>
        <option value="leido">Leído</option>
        <option value="abandonado">Abandonado</option>
      </select>

      <label for="note">Nota</label>
      <textarea id="note" rows="4"></textarea>

      <button type="submit" id="saveBook">
        Guardar libro
      </button>

      <button type="button" id="cancelEdit" class="secondary hidden">
        Cancelar
      </button>

    </form>

  </section>

  <!-- BIBLIOTECA -->

  <section id="biblioteca" class="section">

    <h2>Mi biblioteca</h2>

    <input id="searchBooks" type="search"
           placeholder="Buscar título o autor">

    <div id="bookList"></div>

  </section>

  <!-- NUEVA LECTURA -->

  <section id="nuevaLectura" class="section">

    <h2>Registrar una lectura</h2>

    <form id="readingForm">

      <label for="readingBook">Seleccionar libro</label>

      <select id="readingBook" required>
        <option value="">Selecciona un libro</option>
      </select>

      <label for="newReadingYear">Año de lectura</label>

      <select id="newReadingYear"></select>

      <button type="submit">
        Registrar lectura
      </button>

    </form>

  </section>

  <!-- LECTURAS POR AÑO -->

  <section id="lecturas" class="section">

    <h2>Lecturas por año</h2>

    <label for="readingYear">Seleccionar año</label>

    <select id="readingYear"></select>

    <div class="year-summary">
      <strong id="yearCount">0</strong>
      <span>libros leídos</span>
    </div>

    <div id="readingList"></div>

  </section>

  <!-- COPIAS -->

  <section id="copias" class="section">

    <h2>Copias de seguridad</h2>

    <p>Guarda todos tus libros y lecturas en un archivo.</p>

    <button type="button" id="exportButton">
      Exportar base de datos
    </button>

    <label for="importFile" class="import-label">
      Importar base de datos
    </label>

    <input type="file" id="importFile"
           accept=".json,application/json">

    <p id="message"></p>

  </section>

</main>

<footer>
  Mi Biblioteca
</footer>

<script src="database.js"></script>
<script src="app.js"></script>

</body>
</html>
